    amaster = actx.createGain(); amaster.connect(comp); comp.connect(actx.destination);
    musicBus = actx.createGain(); musicBus.connect(amaster); sfxBus = actx.createGain(); sfxBus.connect(amaster);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

// ---------- Tutorial: panel central con QAI ----------
function tutArt(id, cx, cy) {

    ctx.fillStyle = '#ff2d2d'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + 70, cy); ctx.lineTo(cx + 110, cy - 22); ctx.lineTo(cx + 110, cy + 22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '800 20px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('!', cx + 100, cy + 7);
    ctx.fillStyle = '#ff9a9a'; ctx.font = 'bold 14px ' + FONT; ctx.fillText('NO LO TOQUES', cx - 60, cy + 60);
  } else if (id === 'energy') {
    ctx.fillStyle = '#4be3ff'; ctx.shadowColor = '#4be3ff'; ctx.shadowBlur = 14; ctx.beginPath(); ctx.moveTo(cx - 62, cy - 30); ctx.lineTo(cx - 80, cy + 4); ctx.lineTo(cx - 68, cy + 4); ctx.lineTo(cx - 74, cy + 32); ctx.lineTo(cx - 48, cy - 8); ctx.lineTo(cx - 60, cy - 8); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#10243a'; rr(cx - 20, cy - 12, 150, 24, 6); const v = .35 + .35 * Math.abs(Math.sin(fr / 40)); ctx.fillStyle = v < .4 ? '#ff4d4d' : '#4be3ff'; rr(cx - 17, cy - 9, 144 * v, 18, 4);
  } else if (id === 'pz') { ctx.strokeStyle = 'rgba(75,227,255,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, 44 + Math.sin(fr / 8) * 3, 0, 7); ctx.stroke(); ctx.fillStyle = 'rgba(75,227,255,.14)'; ctx.fill(); heroSprite(cx, cy, 1.1, 0, fr); }
  else if (id === 'px') { ctx.strokeStyle = 'rgba(255,170,60,.7)'; ctx.lineWidth = 3; for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(cx - 130 - k * 8, cy - 28 + k * 18); ctx.lineTo(cx - 70 - ((fr * 3 + k * 20) % 40), cy - 28 + k * 18); ctx.stroke(); } heroSprite(cx, cy, 1.1, 0, fr); }
  else if (id === 'pc') { for (let k = 0; k < 3; k++) { const a = k * 2.1 + fr / 40, rr2 = 70 - ((fr / 2 + k * 30) % 60); drawBox(cx + Math.cos(a) * rr2 + 20, cy + Math.sin(a) * rr2 * .5, 1, BOXC.n); } ctx.strokeStyle = 'rgba(190,120,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx - 40, cy, 58, 0, 7); ctx.stroke(); heroSprite(cx - 40, cy, 1.0, 0, fr); }
  else if (id === 'throw') { drawBoss('retraso', cx + 90, cy, .3, fr, 1); heroSprite(cx - 110, cy, .9, 0, fr, true); const bx = cx - 70 + ((fr * 4) % 130); drawBox(bx, cy, 1, BOXC.n); }
  else if (id === 'deliver') { ctx.strokeStyle = YEL; ctx.lineWidth = 4; ctx.setLineDash([9, 7]); ctx.lineDashOffset = -fr * .4; ctx.beginPath(); ctx.arc(cx + 70, cy, 40, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = 'rgba(253,212,2,.18)'; ctx.fill(); logoAt(ISO, cx + 70, cy - 4, 46); heroSprite(cx - 70, cy, 1.0, 0, fr, true); }

  else if (id === 'traffic') { ctx.font = '70px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('🚦', cx - 100, cy + 24); for (let k = 0; k < 3; k++) { ctx.save(); ctx.translate(cx + 10 + k * 56, cy + Math.sin(fr / 12 + k) * 14); ctx.scale(.9, .9); drawHazard(k === 1 ? 'drone' : 'clock'); ctx.restore(); } }
  else if (id === 'finish') { ['retraso', 'trancon', 'brujula', 'fantasma', 'apagon'].forEach((b, k) => { drawBoss(b, cx - 192 + k * 96, cy + Math.sin(fr / 20 + k) * 4, .17, fr, .95); }); ctx.fillStyle = '#ff9a9a'; ctx.font = 'bold 14px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('5 niveles · 5 villanos', cx, cy + 62); }
  ctx.restore();
}

function draw() {
  btns = []; ctx.setTransform(rs, 0, 0, rs, 0, 0); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.textBaseline = 'alphabetic';
  if (state === 'menu') drawMenu();
  else if (state === 'story') drawStory();
  else if (state === 'tree') drawTree();
  else if (state === 'name') drawName();
  else if (state === 'rank') drawRank();
  else if (state === 'win') drawWin();
  else {
    drawGame();
    if (state === 'tut' && tut.phase === 'explain') drawTutPanel();
    if (state === 'over') drawOver();
    if (paused) drawPause(); if (resting) drawRest(); if (decision) drawDecision(); if (levelIntro) drawLevelIntro(); if (bossIntro) drawBossIntro();
  }
  if (audioOpen) { btns = []; drawAudio(); }
  if (musicTag && fr - musicTag.fr < 260 && state !== 'rank' && state !== 'name') {
    const age = fr - musicTag.fr, a = Math.min(1, (260 - age) / 40, age / 20 + .01);
    ctx.save(); ctx.globalAlpha = a; ctx.font = 'bold 13px ' + FONT; const tw = ctx.measureText(musicTag.s).width + 24;
    ctx.fillStyle = 'rgba(5,16,32,.78)'; rr(W - 16 - tw, 78, tw, 26, 13); ctx.strokeStyle = 'rgba(75,227,255,.6)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.roundRect(W - 16 - tw, 78, tw, 26, 13); ctx.stroke();
    ctx.fillStyle = '#9ef3ff'; ctx.textAlign = 'right'; ctx.fillText(musicTag.s, W - 28, 96); ctx.restore();
  }
  techOverlay();
  nm.style.display = state === 'name' ? 'block' : 'none';
  const hov = btns.some(b => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h);
  cv.style.cursor = hov ? 'pointer' : (((state === 'play' || state === 'tut') && !frozen()) ? 'none' : 'default');
}


// ---------- Render nítido y rendimiento ----------
let rs = 1, qMode = 'auto', qLevel = 3, workEma = 6, slowCount = 0, qCool = 0, ovl = null;
const QNAME = { 3: 'Alta', 2: 'Media', 1: 'Baja' };
try { const q = localStorage.getItem('quickhero_q'); if (q && q !== 'auto') { qMode = +q; qLevel = qMode; } } catch (e) {}
function qLabel() { return qMode === 'auto' ? 'Auto (' + QNAME[qLevel] + ')' : QNAME[qLevel]; }
function buildOverlay() {
  if (qLevel < 2) { ovl = null; return; }
  ovl = document.createElement('canvas'); ovl.width = cv.width; ovl.height = cv.height;
  const o = ovl.getContext('2d'); o.scale(rs, rs);
  o.fillStyle = 'rgba(0,0,0,.05)'; for (let y = 0; y < H; y += 3) o.fillRect(0, y, W, 1);
  const g = o.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .95); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,10,.38)');
  o.fillStyle = g; o.fillRect(0, 0, W, H);
}
function resizeCanvas() {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = window.devicePixelRatio || 1, maxW = isMobile ? 1920 : 2560, f = [.55, .75, 1][qLevel - 1];
  let s = Math.min(r.width * dpr, maxW) * f / W; s = Math.max(.5, s);
  const nw = Math.round(W * s), nh = Math.round(H * s);
  if (cv.width !== nw || cv.height !== nh) { cv.width = nw; cv.height = nh; }
  rs = nw / W; buildOverlay();
}
function setQ(l) { qLevel = l; resizeCanvas(); }
function cycleQ() {
  const order = ['auto', 3, 2, 1]; qMode = order[(order.indexOf(qMode) + 1) % 4]; qLevel = qMode === 'auto' ? 3 : qMode; slowCount = 0; qCool = 120;
  try { localStorage.setItem('quickhero_q', String(qMode)); } catch (e) {}
  resizeCanvas();
}
function perfTick(work, dt) {
  workEma = workEma * .92 + work * .08;
  if (qMode !== 'auto') return;
  if (qCool > 0) { qCool--; return; }
  if ((workEma > 11 || dt > 40) && qLevel > 1) { if (++slowCount > 50) { slowCount = 0; setQ(qLevel - 1); qCool = 240; workEma = 6; } }
  else slowCount = Math.max(0, slowCount - 1);
}
addEventListener('resize', resizeCanvas);
try { new ResizeObserver(resizeCanvas).observe(cv); } catch (e) {}
try { matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)').addEventListener('change', resizeCanvas); } catch (e) {}
let lastT = 0, acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = now - lastT; lastT = now; if (dt > 100) dt = 100;
  acc += dt;
  let n = 0; const w0 = performance.now();
  while (acc >= STEP - 1.2 && n < 4) { update(); acc -= STEP; n++; }
  if (acc > 60) acc = 0;
  if (n > 0) { draw(); perfTick(performance.now() - w0, dt); }
}


rebuildWorld();
resizeCanvas();
requestAnimationFrame(frame);
</script>
